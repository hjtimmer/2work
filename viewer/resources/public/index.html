<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>2work viewer</title>
<style>
body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #1a2433; }
header { background: #1a2433; color: #fff; padding: 12px 24px; display: flex; justify-content: space-between; }
header button { background: #39507a; }
main { max-width: 1200px; margin: 24px auto; padding: 0 16px; }
table.data { border-collapse: collapse; width: 100%; background: #fff; font-size: 14px; }
table.data th, table.data td { border: 1px solid #dde3ea; padding: 6px 10px; text-align: left; }
table.data th { background: #eef2f7; }
table.data tr:nth-child(even) { background: #f9fbfd; }
a.fk { color: #0b5cab; text-decoration: none; }
a.fk:hover { text-decoration: underline; }
input, button { font-size: 14px; padding: 6px 10px; border: 1px solid #b9c3ce; border-radius: 4px; }
button { background: #1a2433; color: #fff; border: none; cursor: pointer; }
.login { max-width: 360px; margin: 80px auto; background: #fff; padding: 32px; border-radius: 8px;
         box-shadow: 0 2px 8px rgba(0,0,0,.08); display: flex; flex-direction: column; gap: 12px; }
.error { color: #b3261e; }
.pager a, .pager span { margin-right: 8px; cursor: pointer; }
ul.tables { columns: 4; }
.hidden { display: none; }
</style>
</head>
<body>
<header>
  <strong>2work viewer</strong>
  <span><span id="wie"></span> <button id="logout" class="hidden">Uitloggen</button></span>
</header>

<div id="login-scherm">
  <form class="login" id="loginform">
    <h2>Inloggen</h2>
    <p id="melding" class="error"></p>
    <input type="text" id="username" placeholder="Gebruikersnaam" required>
    <input type="password" id="password" placeholder="Wachtwoord" required>
    <button type="submit">Inloggen</button>
  </form>
</div>

<main id="app" class="hidden">
  <p><a href="#" id="terug">« Tabellen</a></p>
  <div id="tabellenlijst"><h1>Tabellen</h1><ul class="tables" id="tabellen"></ul></div>
  <div id="tabelweergave" class="hidden">
    <h1 id="titel"></h1>
    <form id="zoekform"><input type="search" id="q" placeholder="Zoeken in alle kolommen...">
      <button type="submit">Zoeken</button></form>
    <table class="data" id="tabel"></table>
    <p class="pager" id="pager"></p>
  </div>
</main>

<script>
const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
let token = null;
let huidigeTabel = null;
let tabelnamen = [];
let wachtend = {};

function stuur(msg, cb) {
  msg.id = Math.random().toString(36).slice(2);
  if (cb) wachtend[msg.id] = cb;
  ws.send(JSON.stringify(msg));
}

ws.onmessage = (e) => {
  const m = JSON.parse(e.data);
  const cb = wachtend[m.id];
  if (cb) { delete wachtend[m.id]; cb(m); }
  else if (m.type === 'fout') alert(m.melding);
};

ws.onopen = () => {};

document.getElementById('loginform').onsubmit = (e) => {
  e.preventDefault();
  stuur({action: 'login',
         username: document.getElementById('username').value,
         password: document.getElementById('password').value},
        (m) => {
          if (m.type === 'login-ok') {
            token = m.token;
            document.getElementById('wie').textContent = 'Ingelogd als ' + m.naam + ' —';
            document.getElementById('login-scherm').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('logout').classList.remove('hidden');
            laadTabellen();
          } else {
            document.getElementById('melding').textContent = m.melding;
          }
        });
};

document.getElementById('logout').onclick = () => stuur({action: 'logout', token: token}, () => location.reload());

function laadTabellen() {
  stuur({action: 'tables', token: token}, (m) => {
    tabelnamen = m.tables.map(t => t.toLowerCase());
    const ul = document.getElementById('tabellen');
    ul.innerHTML = '';
    for (const t of m.tables) {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#'; a.textContent = t;
      a.onclick = (e) => { e.preventDefault(); openTabel(t); };
      li.appendChild(a); ul.appendChild(li);
    }
  });
}

function openTabel(naam, page = 1, q = '') {
  huidigeTabel = naam;
  stuur({action: 'table', token: token, name: naam, page: page, q: q}, (m) => {
    document.getElementById('tabellenlijst').classList.add('hidden');
    document.getElementById('tabelweergave').classList.remove('hidden');
    document.getElementById('titel').textContent = 'Tabel ' + m.name + ' (' + m.total + ' rijen)';
    const tbl = document.getElementById('tabel');
    tbl.innerHTML = '';
    const thead = document.createElement('tr');
    for (const c of m.columns) {
      const th = document.createElement('th'); th.textContent = c; thead.appendChild(th);
    }
    tbl.appendChild(thead);
    for (const row of m.rows) {
      const tr = document.createElement('tr');
      for (const c of m.columns) {
        const td = document.createElement('td');
        const waarde = row[c];
        if (waarde === null || waarde === undefined) {
          td.textContent = '—';
        } else {
          const lc = c.toLowerCase();
          // FK-conventie: kolom eindigt op 'id' en prefix is een bestaande tabel
          if (lc.endsWith('id') && lc.length > 2) {
            const pref = lc.slice(0, -2);
            if (tabelnamen.includes(pref)) {
              const a = document.createElement('a');
              a.className = 'fk'; a.href = '#'; a.textContent = waarde;
              a.onclick = (e) => { e.preventDefault(); openRij(pref, waarde); };
              td.appendChild(a);
              tr.appendChild(td);
              continue;
            }
          }
          td.textContent = waarde;
        }
        tr.appendChild(td);
      }
      tbl.appendChild(tr);
    }
    // paginering
    const laatste = Math.max(1, Math.ceil(m.total / m['page-size']));
    const pager = document.getElementById('pager');
    pager.innerHTML = '';
    if (m.page > 1) {
      const a = document.createElement('a'); a.textContent = '« vorige';
      a.onclick = () => openTabel(m.name, m.page - 1, document.getElementById('q').value);
      pager.appendChild(a);
    }
    const s = document.createElement('span');
    s.textContent = 'pagina ' + m.page + ' van ' + laatste;
    pager.appendChild(s);
    if (m.page < laatste) {
      const a = document.createElement('a'); a.textContent = 'volgende »';
      a.onclick = () => openTabel(m.name, m.page + 1, document.getElementById('q').value);
      pager.appendChild(a);
    }
  });
}

function openRij(naam, id) {
  stuur({action: 'row', token: token, name: naam, 'row-id': id}, (m) => {
    if (m.row) {
      openTabel(naam, 1, '');
      // eenvoudige weergave: de gevonden rij wordt binnenkort gefilterd getoond;
      // voorlopig springen we naar de tabel en tonen we de rij via zoekopdracht.
    }
  });
}

document.getElementById('zoekform').onsubmit = (e) => {
  e.preventDefault();
  openTabel(huidigeTabel, 1, document.getElementById('q').value);
};

document.getElementById('terug').onclick = (e) => {
  e.preventDefault();
  document.getElementById('tabelweergave').classList.add('hidden');
  document.getElementById('tabellenlijst').classList.remove('hidden');
};
</script>
</body>
</html>
